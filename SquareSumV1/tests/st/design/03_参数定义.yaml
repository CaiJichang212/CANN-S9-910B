aclnn_name: "aclnnSquareSumV1"

parameters:
# ── Tensor 输入 ──
- name: "input"
  type: "aclTensor"
  required: true
  io_type: "input"
  format: ["ND"]
  dimensions: [1, 2, 3, 4, 5]
  dtype_with_ranges:
    - dtype: "float16"
      value_range: [[0, 0.001], [0.001, 0.01], [0.01, 1], [1, 2], [2, 10], [10, 1000], [-0.001, 0], [-0.01, -0.001], [-1, -0.01], [-2, -1], [-10, -2], [-1000, -10], [-1, 1], [-0.01, 0.01], [-100, 100], [0, 0], ["+0", "+0"], ["-0", "-0"], [-65504.0, 65504.0], [-0.0078125, 0.0078125], [65504.0, 65504.0], [-65504.0, -65504.0], [-6.103515625e-05, -6.103515625e-05], [6.103515625e-05, 6.103515625e-05], ["inf", "inf"], ["-inf", "-inf"], ["nan", "nan"]]
    - dtype: "float32"
      value_range: [[0, 0.001], [0.001, 0.01], [0.01, 1], [1, 2], [2, 10], [10, 1000], [-0.001, 0], [-0.01, -0.001], [-1, -0.01], [-2, -1], [-10, -2], [-1000, -10], [-1, 1], [-0.01, 0.01], [-100, 100], [-3.4028235e+38, 3.4028235e+38], [0, 0], ["+0", "+0"], ["-0", "-0"], [-0.000030517578125, 0.000030517578125], [3.4028235e+38, 3.4028235e+38], [-3.4028235e+38, -3.4028235e+38], [-1.1754943508e-38, -1.1754943508e-38], [1.1754943508e-38, 1.1754943508e-38], ["inf", "inf"], ["-inf", "-inf"], ["nan", "nan"]]
    - dtype: "bfloat16"
      value_range: [[0, 0.001], [0.001, 0.01], [0.01, 1], [-1, 1], [1, 2], [2, 10], [10, 1000], [-0.001, 0], [-0.01, -0.001], [-1, -0.01], [-2, -1], [-10, -2], [-1000, -10], [-1, 1], [-0.01, 0.01], [-100, 100], [-3.38e+38, 3.38e+38], [0, 0], ["+0", "+0"], ["-0", "-0"], [-0.000030517578125, 0.000030517578125], [3.3895313892515355e+38, 3.3895313892515355e+38], [-3.3895313892515355e+38, -3.3895313892515355e+38], [-1.1754943508e-38, -1.1754943508e-38], [1.1754943508e-38, 1.1754943508e-38], ["inf", "inf"], ["-inf", "-inf"], ["nan", "nan"]]

# ── Array 类 ──
- name: "axis"
  type: "aclIntArray"
  required: true
  io_type: "input"
  length_ranges: [[0, 5]]
  dtype_with_ranges:
    - dtype: "int64"
      value_range: [[-5, -1], [-4, -1], [-3, -1], [-2, -1], [-1, -1], [0, 0], [0, 1], [1, 1], [0, 2], [1, 2], [2, 2], [0, 4], [-1, 0], [-2, -1], [-3, -2], [-4, -3]]

# ── Scalar 类 ──
- name: "keepDims"
  type: "bool"
  required: true
  io_type: "input"
  is_enum: true
  dtype_with_values:
    - dtype: "bool"
      value: [false, true]

# ── Tensor 输出 ──
- name: "result"
  type: "aclTensor"
  required: true
  io_type: "output"
  format: ["ND"]
  dimensions: [0, 1, 2, 3, 4, 5]
  dtype_with_ranges:
    - dtype: "float16"
    - dtype: "float32"
    - dtype: "bfloat16"
