candidate_id: p_all_row_padded
parent_id: p_flat_large_aiv
hypothesis: >-
  generic 广播对每个非对齐 segment 都会把 Compare count 向上取整到256元素，
  因此 rowPadded 的“padding <= 2x”门限不会节省 Vector 工作，反而让短行重复
  执行地址分解、小块搬运和队列操作。移除该门限后，既有多行P1/P2可批量处理
  所有 innerSize<=dtype TILE 的非对齐行。
scope:
  source:
    - Greater/op_project/custom_greater/op_host/greater.cpp
    - Greater/op_project/custom_greater/op_kernel/greater.cpp
  change: 仅移除 Host/Kernel 对 rowElems<=2*innerElems 的镜像条件
